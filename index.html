<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Spin Coating Thickness Calculator</title>
<style>
  :root {
    --bg: #1e1e24; --bg-light: #2a2a33; --fg: #e0dff0;
    --accent: #9b59d9; --accent-dark: #6c3fa0; --status: #c9a6f5; --error: #e06666;
    --font-ui: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    --font-mono: Consolas, "SFMono-Regular", Menlo, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 var(--font-ui); }
  body { padding: 14px 14px calc(14px + env(safe-area-inset-bottom, 0px)); }
  h1 { margin: 4px 0 14px; font-size: 20px; color: var(--accent); }
  fieldset { border: 1px solid var(--accent-dark); border-radius: 3px; padding: 12px; margin: 0; min-width: 0; }
  legend { padding: 0 6px; color: var(--accent); font-weight: 700; }
  .grid { display: grid; gap: 14px; grid-template-columns: 380px minmax(0, 1fr); align-items: start; }
  .col-main { display: grid; gap: 14px; min-width: 0; }
  .bottom { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 640px) {
    .bottom { grid-template-columns: 1fr; }
  }

  .field { margin-bottom: 4px; }
  .field-row { display: flex; align-items: center; gap: 8px; }
  .box {
    position: relative; width: 140px; height: 26px; background: var(--bg-light);
    border: 1px solid var(--accent-dark); border-radius: 2px; overflow: hidden;
    cursor: ew-resize; user-select: none; flex: none;
  }
  .box .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent-dark); width: 0; pointer-events: none; }
  .box .val { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: 12px; background: transparent; border: none; color: var(--fg); text-align: center; padding: 0; }
  .box .val:focus { outline: 1px solid var(--accent); }
  label.flabel { font-size: 13px; }
  .help { font-size: 11px; color: var(--status); margin: 2px 0 8px; max-width: 300px; }
  select, input.text {
    background: var(--bg-light); color: var(--fg); border: 1px solid var(--accent-dark); border-radius: 2px;
    padding: 5px 6px; font: inherit; width: 100%;
  }
  .dropdown { margin-bottom: 4px; }
  hr.sep { border: none; border-top: 1px solid var(--accent-dark); margin: 10px 0; }
  button {
    background: var(--bg-light); color: var(--fg); border: 1px solid var(--accent-dark); border-radius: 2px;
    padding: 6px 10px; font: inherit; cursor: pointer;
  }
  button:hover { background: var(--accent-dark); }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { min-width: 0; }
  .status-line { font-size: 12px; color: var(--status); margin-top: 8px; min-height: 1.4em; }
  .status-line.error { color: var(--error); }

  .result-big { font-size: 26px; font-weight: 700; color: var(--accent); }
  .result-big.error { font-size: 15px; color: var(--error); }
  .result-small { font-size: 13px; color: var(--status); }

  .plot-opts { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; flex-wrap: wrap; font-size: 12px; }
  .plot-opts .box { width: 80px; }
  svg#plot { display: block; width: 100%; height: clamp(280px, 40vw, 400px); background: var(--bg-light);
    border: 1px solid var(--accent-dark); border-radius: 2px; }
  svg#plot text { font-family: var(--font-ui); text-rendering: geometricPrecision; }
  .tick-label { font-size: 11px; fill: var(--status); }
  .axis-title { font-size: 12px; fill: var(--status); }
  .grid-line { stroke: var(--accent-dark); stroke-width: 1; opacity: .55; shape-rendering: crispEdges; }
  .axis-line { stroke: var(--accent); stroke-width: 1; shape-rendering: crispEdges; }
  .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
  .band { fill: var(--accent-dark); opacity: .45; }
  .marker-line { stroke: var(--status); stroke-width: 1; stroke-dasharray: 2 3; opacity: .8; shape-rendering: crispEdges; }
  .marker { fill: var(--fg); stroke: var(--accent); stroke-width: 2; }
  .tag-bg { fill: var(--bg); stroke: var(--accent); stroke-width: 1; }
  .tag-text { font-size: 12px; fill: var(--fg); }

  footer { margin-top: 16px; text-align: center; font-size: 12px; opacity: .8; }
  footer a { color: var(--status); }
</style>
</head>
<body>
<h1>Spin Coating Thickness Calculator</h1>

<div class="grid">
  <fieldset class="col-input">
    <legend>Input</legend>
    <div id="in-rpm"></div>
    <div id="in-visc"></div>
    <div id="in-density"></div>
    <div id="in-evap"></div>
    <div class="dropdown">
      <label class="flabel">Evaporation rate vs. spin speed</label>
      <select id="in-escaling">
        <option value="sqrt" selected>Grows with sqrt(rpm) (Meyerhofer)</option>
        <option value="constant">Constant (independent of rpm)</option>
      </select>
    </div>
    <hr class="sep">
    <div class="dropdown">
      <label class="flabel">Model</label>
      <select id="in-model">
        <option value="emslie">Emslie-Bonner-Peck (1958)</option>
        <option value="meyerhofer" selected>Meyerhofer (1978)</option>
        <option value="flack">Flack et al. (1984), depth-averaged</option>
      </select>
    </div>
    <div id="group-emslie">
      <div id="in-h0"></div>
      <div id="in-time"></div>
    </div>
    <div id="group-advanced" style="display:none">
      <div class="dropdown">
        <label class="flabel">Viscosity law</label>
        <select id="in-visclaw">
          <option value="exponential" selected>Exponential, k_eta (generic)</option>
          <option value="flack_table1">Flack Table I (PMMA, measured)</option>
        </select>
      </div>
      <div id="in-keta"></div>
      <div id="in-nevap"></div>
    </div>
    <hr class="sep">
    <div class="dropdown">
      <label class="flabel">Solids fraction from</label>
      <select id="in-mode">
        <option value="direct" selected>Volume fraction directly</option>
        <option value="weight">From weight fraction + densities</option>
      </select>
    </div>
    <div id="group-direct">
      <div id="in-c0"></div>
    </div>
    <div id="group-weight" style="display:none">
      <div id="in-weight"></div>
      <div id="in-dsolute"></div>
      <div id="in-dsolvent"></div>
    </div>
  </fieldset>

  <div class="col-main">
    <fieldset>
      <legend>Film Thickness vs. Spin Speed</legend>
      <div class="plot-opts">
        <span>Plot range:</span><div id="in-plotmin"></div><span>to</span><div id="in-plotmax"></div><span>rpm</span>
        <label><input type="checkbox" id="in-showband" checked> Show uncertainty band</label>
      </div>
      <svg id="plot" role="img" aria-label="Film thickness versus spin speed"></svg>
    </fieldset>

    <div class="bottom">
      <fieldset>
    <legend>Result</legend>
    <div class="result-big" id="out-main">--</div>
    <div class="result-small" id="out-caption"></div>
    <div class="result-small" id="out-transition" style="margin-top:8px"></div>
    <div class="result-small" id="out-omega"></div>
    <div class="result-small" id="out-c0"></div>
    <hr class="sep">
    <div class="result-small" id="out-stat1"></div>
    <div class="result-small" id="out-stat2"></div>
    <div class="result-small" id="out-stat3"></div>
  </fieldset>

      <fieldset>
    <legend>Statistical Deviation</legend>
    <div class="dropdown">
      <label class="flabel">Method</label>
      <select id="in-method">
        <option value="none" selected>None</option>
        <option value="gauss">Gauss (analytic)</option>
        <option value="mc">Monte Carlo</option>
      </select>
    </div>
    <div id="group-unc" style="display:none">
      <div id="group-mc" style="display:none">
        <div class="dropdown">
          <label class="flabel">Distribution shape (Monte Carlo)</label>
          <select id="in-mcdist">
            <option value="gauss" selected>Normal distribution (Gauss)</option>
            <option value="uniform">Uniform distribution</option>
            <option value="triangular">Triangular distribution</option>
          </select>
        </div>
        <div id="in-mcn"></div>
      </div>
      <div id="group-mc-run" style="display:none">
        <div class="help">Advanced model: each sample re-solves the full ODE, so this isn't live -- click to
          (re)compute:</div>
        <button id="mc-run" type="button">Run Monte Carlo</button>
      </div>
      <div class="help">Uncertainties (+/-, 0 = none):</div>
      <div id="in-sig-rpm"></div>
      <div id="in-sig-visc"></div>
      <div id="in-sig-density"></div>
      <div id="in-sig-evap"></div>
      <div id="in-sig-c0"></div>
      <div id="in-sig-h0"></div>
      <div id="in-sig-time"></div>
      <div id="in-sig-keta"></div>
      <div id="in-sig-nevap"></div>
    </div>
  </fieldset>
    </div>
  </div>
</div>

<footer>Open source &middot; <a href="https://github.com/jesajaw/spin-coating">github.com/jesajaw/spin-coating</a></footer>

<script>
"use strict";
// ============================================================================
// LOGIC_START -- pure model logic (no DOM); mirrors src/model/*.py exactly.
// ============================================================================
const RPM_TO_RAD_S = Math.PI / 30.0;
const CP_TO_PA_S = 1.0e-3;
const G_CM3_TO_KG_M3 = 1.0e3;
const UM_S_TO_M_S = 1.0e-6;
const M_TO_NM = 1.0e9;
const M_TO_UM = 1.0e6;

function fromLabUnits(rpm, viscCp, densGcm3, evapUmS, c0) {
  return {
    omega: rpm * RPM_TO_RAD_S,
    viscosity: viscCp * CP_TO_PA_S,
    density: densGcm3 * G_CM3_TO_KG_M3,
    evaporationRate: evapUmS * UM_S_TO_M_S,
    solidsFraction: c0,
  };
}

function validate(p) {
  if (p.omega <= 0) return "Spin speed must be > 0.";
  if (p.viscosity <= 0) return "Viscosity must be > 0.";
  if (p.density <= 0) return "Density must be > 0.";
  if (p.evaporationRate <= 0) return "Evaporation rate must be > 0.";
  if (!(p.solidsFraction > 0 && p.solidsFraction < 1)) return "Solids volume fraction must be between 0 and 1 (exclusive).";
  return null;
}

// Eq. 2/3 (see src/model/meyerhofer.py for the full derivation and references)
function compute(p) {
  const err = validate(p);
  if (err) throw new Error(err);
  const hS = Math.cbrt((3 * p.viscosity * p.evaporationRate) / (2 * p.density * p.omega ** 2 * (1 - p.solidsFraction)));
  const hF = p.solidsFraction * hS;
  return { omega: p.omega, transitionThickness: hS, finalThickness: hF,
    finalThicknessNm: hF * M_TO_NM, finalThicknessUm: hF * M_TO_UM, transitionThicknessUm: hS * M_TO_UM };
}

function volumeFractionFromWeightFraction(w, densSolute, densSolvent) {
  if (!(w > 0 && w < 1)) throw new Error("Weight fraction must be between 0 and 1 (exclusive).");
  if (densSolute <= 0 || densSolvent <= 0) throw new Error("Densities must be > 0.");
  const vSolute = w / densSolute, vSolvent = (1 - w) / densSolvent;
  return vSolute / (vSolute + vSolvent);
}

function evaporationAt(eRefUmS, rpmRef, rpm, scaling) {
  return scaling === "sqrt" ? eRefUmS * Math.sqrt(rpm / rpmRef) : eRefUmS;
}

function thicknessNm(rpm, viscCp, densGcm3, eUmS, c0) {
  return compute(fromLabUnits(rpm, viscCp, densGcm3, eUmS, c0)).finalThicknessNm;
}

// Emslie-Bonner-Peck (1958), Eq. 3 of the Ossila guide: wet thickness after time t, no evaporation
function emslieThicknessNm(rpm, viscCp, densGcm3, h0Um, timeS) {
  const w = rpm * RPM_TO_RAD_S, eta = viscCp * CP_TO_PA_S, rho = densGcm3 * G_CM3_TO_KG_M3, h0 = h0Um * UM_S_TO_M_S;
  if (!(w > 0 && eta > 0 && rho > 0 && h0 > 0)) throw new Error("Spin speed, viscosity, density and initial thickness must be > 0.");
  if (!(timeS >= 0)) throw new Error("Spin time must be >= 0.");
  return h0 / Math.sqrt(1 + (4 * rho * w * w * h0 * h0 * timeS) / (3 * eta)) * M_TO_NM;
}

// One entry point for all three models. lab.rpmRef is the speed E is specified at (E scales away from it).
function thicknessAtRpm(lab, rpm) {
  if (lab.model === "emslie") return emslieThicknessNm(rpm, lab.viscosityCp, lab.densityGcm3, lab.h0Um, lab.timeS);
  const e = evaporationAt(lab.evaporationUmS, lab.rpmRef === undefined ? lab.rpm : lab.rpmRef, rpm, lab.eScaling);
  if (lab.model === "flack") return advThicknessNm(Object.assign({}, lab, { rpm }), e);
  return thicknessNm(rpm, lab.viscosityCp, lab.densityGcm3, e, lab.solidsFraction);
}

function spinCurve(lab, rpmMin, rpmMax, points) {
  if (!(rpmMin > 0 && rpmMin < rpmMax)) throw new Error("Plot range needs 0 < min < max.");
  points = Math.max(points, 2);
  const ratio = Math.pow(rpmMax / rpmMin, 1 / (points - 1));
  const out = [];
  for (let i = 0; i < points; i++) {
    const x = rpmMin * Math.pow(ratio, i);
    out.push([x, thicknessAtRpm(lab, x)]);
  }
  return out;
}

// -- deviation: analytic Gauss propagation (mirrors src/model/deviation.py) --
const SIGMA_KEYS = ["rpm", "viscosityCp", "densityGcm3", "evaporationUmS", "solidsFraction", "h0Um", "timeS", "kEta", "nEvap"];

function activeKeys(lab) {
  if (lab.model === "emslie") return ["rpm", "viscosityCp", "densityGcm3", "h0Um", "timeS"];
  const base = ["rpm", "viscosityCp", "densityGcm3", "evaporationUmS", "solidsFraction"];
  if (lab.model !== "flack") return base;
  return base.concat(lab.viscLaw === "flack_table1" ? ["nEvap"] : ["kEta", "nEvap"]);
}

function clampKey(k, x) {
  if (k === "solidsFraction") return Math.min(Math.max(x, 1e-6), 0.999999);
  if (k === "timeS" || k === "kEta" || k === "nEvap") return Math.max(x, 0);
  return Math.max(x, 1e-9);
}

// Absolute 1-sigma [nm] from first-order propagation; the partial derivatives are central differences
// (mirrors src/model/deviation.py, which also differentiates numerically for the Flack model).
function sigmaAnalyticNm(lab, sig, rpm) {
  rpm = rpm === undefined ? lab.rpm : rpm;
  let sum = 0;
  for (const k of activeKeys(lab)) {
    const s = sig[k] || 0;
    if (!(s > 0)) continue;
    const x = k === "rpm" ? rpm : lab[k];
    let d = Math.max(Math.abs(x) * 1e-3, 1e-9);
    if (k === "solidsFraction") d = Math.min(d, x * 0.5, (1 - x) * 0.5);
    const lo = clampKey(k, x - d), hi = clampKey(k, x + d);
    const f = v => k === "rpm" ? thicknessAtRpm(lab, v) : thicknessAtRpm(Object.assign({}, lab, { [k]: v }), rpm);
    const deriv = (f(hi) - f(lo)) / (hi - lo);
    sum += (deriv * s) ** 2;
  }
  return Math.sqrt(sum);
}

function propagateAnalytic(lab, sig, nominalNm) {
  const sigmaNm = sigmaAnalyticNm(lab, sig);
  return { meanNm: nominalNm, sigmaNm, relativeSigma: nominalNm > 0 ? sigmaNm / nominalNm : 0 };
}

function analyticBand(lab, sig, curve) {
  return curve.map(([rpm, h]) => { const s = sigmaAnalyticNm(lab, sig, rpm); return [h - s, h + s]; });
}

// -- deviation: Monte Carlo (mirrors src/model/deviation.py) -----------------
// Small seeded PRNG (mulberry32) so results are reproducible -- unrelated
// re-computes must not make the numbers jitter, same as the fixed seed
// used on the Python side (a different RNG algorithm, so figures won't
// match bit-for-bit between the two versions, but both are internally stable).
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function unitDraws(kind, n, seed) {
  const rnd = mulberry32(seed);
  const gauss = () => { // Box-Muller
    let u = 0, v = 0;
    while (u === 0) u = rnd();
    while (v === 0) v = rnd();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  };
  const triangular = () => { const u = rnd(); return u < 0.5 ? (Math.sqrt(u / 2) * 2 - 1) : (1 - Math.sqrt((1 - u) / 2) * 2); };
  const draw = kind === "gauss" ? gauss : kind === "uniform" ? () => rnd() * 2 - 1 : triangular;
  const out = [];
  for (let i = 0; i < n; i++) out.push(Array.from({ length: SIGMA_KEYS.length }, draw));
  return out;
}

function sampleThickness(lab, sig, u, rpmNominal) {
  const l = Object.assign({}, lab);
  SIGMA_KEYS.forEach((k, i) => {
    if (k !== "rpm" && (sig[k] || 0) > 0) l[k] = clampKey(k, lab[k] + sig[k] * u[i]);
  });
  const rpm = Math.max(rpmNominal + (sig.rpm || 0) * u[0], 1e-6);
  return thicknessAtRpm(l, rpm);
}

function percentile(sorted, p) { return sorted[Math.min(Math.floor(p * sorted.length), sorted.length - 1)]; }

function propagateMonteCarlo(lab, sig, kind, n, seed) {
  if (n < 2) throw new Error("Monte Carlo needs at least 2 samples.");
  const draws = unitDraws(kind, n, seed);
  const samples = draws.map(u => sampleThickness(lab, sig, u, lab.rpm)).sort((a, b) => a - b);
  const mean = samples.reduce((a, b) => a + b, 0) / n;
  const variance = samples.reduce((a, b) => a + (b - mean) ** 2, 0) / (n - 1);
  return { n, meanNm: mean, stdNm: Math.sqrt(variance), p05Nm: percentile(samples, 0.05),
    p50Nm: percentile(samples, 0.5), p95Nm: percentile(samples, 0.95) };
}

function monteCarloBand(lab, sig, kind, rpms, n, seed) {
  const draws = unitDraws(kind, n, seed);
  return rpms.map(rpm => {
    const samples = draws.map(u => sampleThickness(lab, sig, u, rpm)).sort((a, b) => a - b);
    return [percentile(samples, 0.05), percentile(samples, 0.95)];
  });
}

// ============================================================================
// ADVANCED MODEL -- concentration-dependent viscosity & evaporation, solved
// by direct numerical integration. Mirrors src/model/flack.py
// (see that file's docstring for the physics, references, and honest
// limitations -- this is NOT a literal port of Flack (1984) or Bornside
// (1989); it is Meyerhofer's own general Eq. 1, integrated numerically with
// eta and E allowed to depend on concentration, as a depth-averaged
// approximation of the mechanism those papers describe).
// ============================================================================
const SOLVENT_DEPLETION_TOL = 1e-7;

// Flack et al. (1984), Table I: zero-shear viscosity of PMMA/chlorobenzene, w = polymer weight fraction
const PAPER_ETA_REF = 7.06e6, PAPER_ETA_SOLVENT = 0.0008; // Pa s
function paperEta(w) {
  w = Math.min(Math.max(w, 1e-9), 1);
  const c = 1 - w;
  return PAPER_ETA_REF * Math.exp(-c / (0.043 + 0.040 * c)) * Math.pow(w, 2.33) + PAPER_ETA_SOLVENT;
}
// eta(phi) / eta(C0): 1 at the dispensed concentration
function viscosityFactor(phi, c0, kEta, law) {
  return law === "flack_table1" ? paperEta(phi) / paperEta(c0) : Math.exp(kEta * (phi - c0));
}
function advEvap(phi, e0, nEvap) { return nEvap > 0 ? e0 * Math.pow(Math.max(1 - phi, 0), nEvap) : e0; }

function advDerivatives(q, s, p) {
  const h = q + s;
  const phi = h > 0 ? q / h : 1.0;
  const eta = p.eta0 * viscosityFactor(phi, p.phi0, p.kEta, p.viscLaw);
  const qFlow = (2 * p.rho * p.omega ** 2 * h ** 3) / (3 * eta);
  const dq = -phi * qFlow;
  const ds = -(1 - phi) * qFlow - advEvap(phi, p.e0, p.nEvap);
  return [dq, ds];
}

function advInitialThickness(p, headroom) {
  // Same length scale as Meyerhofer's own h_s, used only to seed a "large
  // enough" wet starting thickness -- see compute()/transitionThickness().
  const hS = Math.cbrt((3 * p.eta0 * p.e0) / (2 * p.rho * p.omega ** 2 * (1 - p.phi0)));
  return headroom * hS;
}

function advRk4Step(q, s, p, dt) {
  const clampQ = v => Math.max(v, 0);
  const clampS = v => Math.max(v, 0);
  let [k1q, k1s] = advDerivatives(q, s, p);
  let q2 = clampQ(q + 0.5 * dt * k1q), s2 = clampS(s + 0.5 * dt * k1s);
  let [k2q, k2s] = advDerivatives(q2, s2, p);
  let q3 = clampQ(q + 0.5 * dt * k2q), s3 = clampS(s + 0.5 * dt * k2s);
  let [k3q, k3s] = advDerivatives(q3, s3, p);
  let q4 = clampQ(q + dt * k3q), s4 = clampS(s + dt * k3s);
  let [k4q, k4s] = advDerivatives(q4, s4, p);
  const dq = (dt / 6) * (k1q + 2 * k2q + 2 * k3q + k4q);
  const ds = (dt / 6) * (k1s + 2 * k2s + 2 * k3s + k4s);
  return [dq, ds];
}

function advSimulate(p, headroom = 20, maxSteps = 4000, relTol = 1e-7) {
  if (!(p.omega > 0 && p.eta0 > 0 && p.rho > 0 && p.e0 > 0)) throw new Error("Spin speed, viscosity, density and evaporation rate must all be > 0.");
  if (!(p.phi0 > 0 && p.phi0 < 1)) throw new Error("Initial solids volume fraction must be between 0 and 1 (exclusive).");

  const h0 = advInitialThickness(p, headroom);
  let q = h0 * p.phi0, s = h0 * (1 - p.phi0);
  const sFloor = s * SOLVENT_DEPLETION_TOL;
  const tau0 = (3 * p.eta0) / (4 * p.rho * p.omega ** 2 * h0 ** 2);
  let dt = tau0 * 0.05;
  let steps = 0, converged = false;

  for (let iter = 0; iter < maxSteps; iter++) {
    let qMid, sMid, q2s, err;
    for (let retry = 0; retry < 40; retry++) {
      const [dqFull] = advRk4Step(q, s, p, dt);
      const [dq1, ds1] = advRk4Step(q, s, p, dt * 0.5);
      qMid = Math.max(q + dq1, 0); sMid = Math.max(s + ds1, 0);
      const [dq2, ds2] = advRk4Step(qMid, sMid, p, dt * 0.5);
      q2s = [Math.max(qMid + dq2, 0), Math.max(sMid + ds2, 0)];
      const qFull = Math.max(q + dqFull, 0);
      err = Math.abs(q2s[0] - qFull) / Math.max(q2s[0], 1e-30);
      if (err <= relTol || dt < tau0 * 1e-10) break;
      dt *= 0.5;
    }
    const sHalf = q2s[1];
    if (sHalf <= sFloor) {
      let lo = 0, hi = dt, qAt = q, sAt = s;
      for (let b = 0; b < 30; b++) {
        const mid = 0.5 * (lo + hi);
        const [dqm, dsm] = advRk4Step(q, s, p, mid);
        const sTry = Math.max(s + dsm, 0);
        if (sTry > sFloor) { lo = mid; } else { hi = mid; qAt = Math.max(q + dqm, 0); sAt = sTry; }
      }
      q = qAt; s = sAt; steps++; converged = true;
      break;
    }
    q = q2s[0]; s = sHalf; steps++;
    if (err <= relTol / 8) dt *= 1.3;
  }

  return { finalThickness: q, finalPhi: (q + s) > 0 ? q / (q + s) : 1.0, steps, converged };
}

function advThicknessNm(lab, eUmS) {
  if (!(lab.kEta >= 0)) throw new Error("Viscosity growth k_eta must be >= 0.");
  if (!(lab.nEvap >= 0)) throw new Error("Evaporation slowdown n must be >= 0.");
  const p = { omega: lab.rpm * Math.PI / 30, eta0: lab.viscosityCp * 1e-3, rho: lab.densityGcm3 * 1e3,
              e0: eUmS * 1e-6, phi0: lab.solidsFraction, kEta: lab.kEta, nEvap: lab.nEvap, viscLaw: lab.viscLaw };
  const r = advSimulate(p);
  if (!r.converged) throw new Error("Integration did not converge (solvent never fully depleted) -- try a smaller n or check the inputs.");
  return r.finalThickness * 1e9;
}

// ============================================================================
// UI: a NumberField mirrors ui/widgets.py's NumberField (drag-fill box + type-to-edit)
// ============================================================================
const $ = id => document.getElementById(id);

function makeField(container, label, value, min, max, fmt, onChange, help, boxWidth, log) {
  boxWidth = boxWidth || 140;
  const wrap = document.createElement("div");
  wrap.className = "field";
  const row = document.createElement("div");
  row.className = "field-row";
  const box = document.createElement("div");
  box.className = "box";
  box.style.width = boxWidth + "px";
  const fill = document.createElement("div");
  fill.className = "fill";
  const input = document.createElement("input");
  input.className = "val";
  input.type = "text";
  input.inputMode = "decimal";
  box.appendChild(fill);
  box.appendChild(input);
  row.appendChild(box);
  const lab = document.createElement("label");
  lab.className = "flabel";
  lab.textContent = label;
  row.appendChild(lab);
  wrap.appendChild(row);
  if (help) {
    const h = document.createElement("div");
    h.className = "help";
    h.textContent = help;
    wrap.appendChild(h);
  }
  container.appendChild(wrap);

  const field = { value, min, max, fmt, log: !!log };
  function frac() {
    if (field.log && field.min > 0) return (Math.log(field.value) - Math.log(field.min)) / (Math.log(field.max) - Math.log(field.min));
    return (field.value - field.min) / (field.max - field.min);
  }
  function redraw() {
    fill.style.width = Math.max(0, Math.min(1, frac())) * 100 + "%";
    input.value = fmt(field.value);
  }
  function setValue(v, fire) {
    field.value = Math.min(Math.max(v, field.min), field.max);
    redraw();
    if (fire && onChange) onChange(field.value);
  }
  field.set = setValue;
  field.get = () => field.value;

  let dragging = false;
  function valueFromX(x) {
    const rect = box.getBoundingClientRect();
    const f = Math.max(0, Math.min(1, (x - rect.left) / rect.width));
    if (field.log && field.min > 0) return Math.exp(Math.log(field.min) + f * (Math.log(field.max) - Math.log(field.min)));
    return field.min + f * (field.max - field.min);
  }
  box.addEventListener("pointerdown", e => {
    if (document.activeElement === input) return;
    dragging = true;
    box.setPointerCapture(e.pointerId);
    setValue(valueFromX(e.clientX), true);
  });
  box.addEventListener("pointermove", e => { if (dragging) setValue(valueFromX(e.clientX), true); });
  box.addEventListener("pointerup", () => { dragging = false; });
  box.addEventListener("dblclick", () => { input.focus(); input.select(); });
  input.addEventListener("keydown", e => { if (e.key === "Enter") input.blur(); });
  input.addEventListener("focus", () => { dragging = false; });
  input.addEventListener("blur", () => {
    const v = parseFloat(input.value);
    if (!isNaN(v)) setValue(v, true); else redraw();
  });

  redraw();
  return field;
}

const fmt = d => v => v.toFixed(d);

function currentModel() { return $("in-model").value; }

}

}
onModelChange();

// ============================================================================
// Debounce (mirrors app.py's DEBOUNCE_MS)
// ============================================================================
let debounceId = null;
function markDirty() {
  if (debounceId !== null) clearTimeout(debounceId);
  debounceId = setTimeout(recompute, 150);
}

// ============================================================================
// Read current state -> model inputs
// ============================================================================
function solidsFraction() {
  if ($("in-mode").value === "direct") return F.c0.get() / 100;
  return volumeFractionFromWeightFraction(F.weight.get() / 100, F.dsolute.get(), F.dsolvent.get());
}
function labInput(c0) {
  return { model: currentModel(), rpm: F.rpm.get(), rpmRef: F.rpm.get(), viscosityCp: F.visc.get(),
    densityGcm3: F.density.get(), evaporationUmS: F.evap.get(), solidsFraction: c0, eScaling: $("in-escaling").value,
    h0Um: F.h0.get(), timeS: F.time.get(), kEta: F.kEta.get(), nEvap: F.nEvap.get(), viscLaw: $("in-visclaw").value };
}
function sigmas() {
  return { rpm: F.sigRpm.get(), viscosityCp: F.sigVisc.get(), densityGcm3: F.sigDensity.get(),
    evaporationUmS: F.sigEvap.get(), solidsFraction: F.sigC0.get() / 100, h0Um: F.sigH0.get(), timeS: F.sigTime.get(),
    kEta: F.sigKeta.get(), nEvap: F.sigNevap.get() };
}
function sigmasAny(s, lab) { return activeKeys(lab).some(k => (s[k] || 0) > 0); }

// ============================================================================
// Recompute: result panel + plot
// ============================================================================
function recompute() {
  debounceId = null;
  const model = currentModel();
  const flMc = model === "flack" && $("in-method").value === "mc";
  if (!flMc) { $("out-stat1").textContent = ""; $("out-stat2").textContent = ""; $("out-stat3").textContent = ""; }
  let c0, lab, finalNm;
  try {
    c0 = model === "emslie" ? 0.1 : solidsFraction();
    lab = labInput(c0);
    finalNm = thicknessAtRpm(lab, lab.rpm);
  } catch (e) {
    $("out-main").textContent = "--";
    $("out-main").className = "result-big error";
    $("out-caption").textContent = e.message;
    drawPlot([], null, null, false, ["h", "f", " [nm]"]);
    return;
  }
  $("out-main").className = "result-big";
  $("out-main").textContent = finalNm.toLocaleString(undefined, { maximumFractionDigits: 1, minimumFractionDigits: 1 }) + " nm";
  const what = model === "emslie" ? "wet film thickness after the spin time" : "final dry film thickness";
  $("out-caption").textContent = `(${(finalNm / 1000).toFixed(3)} \u00b5m)  ${what}`;
  const omega = (lab.rpm * Math.PI / 30).toFixed(1);
  if (model === "emslie") {
    $("out-transition").textContent = `Spin time t = ${lab.timeS.toFixed(1)} s, h0 = ${lab.h0Um.toFixed(1)} \u00b5m`;
    $("out-c0").textContent = "";
  } else if (model === "flack") {
    const law = lab.viscLaw === "flack_table1" ? "Flack Table I (PMMA)" : `exponential, k_eta = ${lab.kEta.toFixed(2)}`;
    $("out-transition").textContent = `Flack depth-averaged: viscosity ${law}, n = ${lab.nEvap.toFixed(2)}`;
    $("out-c0").textContent = `Volume fraction c0 used: ${(c0 * 100).toFixed(2)} %`;
  } else {
    const result = compute(fromLabUnits(lab.rpm, lab.viscosityCp, lab.densityGcm3, lab.evaporationUmS, c0));
    $("out-transition").textContent = `Wet transition thickness h_s: ${result.transitionThicknessUm.toFixed(3)} \u00b5m`;
    $("out-c0").textContent = `Volume fraction c0 used: ${(c0 * 100).toFixed(2)} %`;
  }
  $("out-omega").textContent = `Omega used: ${omega} rad/s`;

  const rpmMin = F.plotMin.get(), rpmMax = F.plotMax.get();
  const method = $("in-method").value;
  let curve = [], band = null;
  try {
    if (rpmMin < rpmMax) {
      curve = spinCurve(lab, rpmMin, rpmMax, 60);
      if (method !== "none" && !flMc && $("in-showband").checked) {
        const sig = sigmas();
        if (sigmasAny(sig, lab)) {
          band = method === "gauss" ? analyticBand(lab, sig, curve)
            : monteCarloBand(lab, sig, $("in-mcdist").value, curve.map(p => p[0]), 800, 12345);
        }
      }
    }
  } catch (e) { curve = []; }
  drawPlot(curve, band, [lab.rpm, finalNm], true, model === "emslie" ? ["h(t) [nm]", "", ""] : ["h", "f", " [nm]"]);

  if (method === "none" || flMc) return;
  try {
    const sig = sigmas();
    if (method === "gauss") {
      const a = propagateAnalytic(lab, sig, finalNm);
      $("out-stat1").textContent = `h = ${a.meanNm.toFixed(1)} +/- ${a.sigmaNm.toFixed(1)} nm  (1 sigma, Gauss)`;
      $("out-stat2").textContent = `relative uncertainty: ${(a.relativeSigma * 100).toFixed(1)} %`;
      $("out-stat3").textContent = `~95% range (+/-2 sigma): ${(a.meanNm - 2 * a.sigmaNm).toFixed(1)} - ${(a.meanNm + 2 * a.sigmaNm).toFixed(1)} nm`;
    } else {
      showMc(propagateMonteCarlo(lab, sig, $("in-mcdist").value, Math.round(F.mcN.get()), 12345));
    }
  } catch (e) { $("out-stat1").textContent = "! " + e.message; }
}

function showMc(mc) {
  $("out-stat1").textContent = `h = ${mc.meanNm.toFixed(1)} nm  (Monte Carlo, n = ${mc.n})`;
  $("out-stat2").textContent = `standard deviation: ${mc.stdNm.toFixed(1)} nm`;
  $("out-stat3").textContent = `P05 / P50 / P95: ${mc.p05Nm.toFixed(1)} / ${mc.p50Nm.toFixed(1)} / ${mc.p95Nm.toFixed(1)} nm`;
}

function runFlackMonteCarlo() {
  if (!(currentModel() === "flack" && $("in-method").value === "mc")) return;
  $("out-stat1").textContent = "Running...";
  setTimeout(() => {   // small delay so "Running..." paints before the blocking computation
    try {
      const lab = labInput(solidsFraction());
      showMc(propagateMonteCarlo(lab, sigmas(), $("in-mcdist").value, Math.round(F.mcN.get()), 12345));
    } catch (e) { $("out-stat1").textContent = "! " + e.message; }
  }, 10);
}

// ============================================================================
// Plot: plain SVG line chart (log-x), mirrors ui/widgets.py's SpinCurvePlot.
// The SVG is drawn at its real pixel size (viewBox = CSS size, redrawn on resize), so text, lines
// and the marker are never stretched or resampled -> sharp on every screen.
// ============================================================================
const SVGNS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs, text) {
  const el = document.createElementNS(SVGNS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  if (text !== undefined) el.textContent = text;
  return el;
}
const fmtInt = v => Math.round(v).toLocaleString("en-US");

// "nice" linear ticks: about n steps of 1, 2, 2.5, 5 x 10^k covering [lo, hi]
function niceLinearTicks(lo, hi, n) {
  const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(v => v >= raw) || 10 * mag;
  const ticks = [];
  for (let v = Math.ceil(lo / step - 1e-9) * step; v <= hi + step * 1e-9; v += step) ticks.push(Math.round(v / step) * step);
  return { ticks, step };
}
// log ticks at 1, 1.5, 2, 3, 4, 5, 7 x 10^k, thinned until labels are at least minGap px apart
function niceLogTicks(x0, x1, widthPx, minGap, pxOf) {
  const sets = [[1, 1.5, 2, 3, 4, 5, 7], [1, 2, 3, 5, 7], [1, 2, 5], [1]];
  for (const mant of sets) {
    const ticks = [];
    for (let k = Math.floor(Math.log10(x0)) - 1; k <= Math.ceil(Math.log10(x1)); k++)
      for (const m of mant) { const v = m * Math.pow(10, k); if (v >= x0 * 0.999 && v <= x1 * 1.001) ticks.push(v); }
    let ok = ticks.length >= 2;
    for (let i = 1; ok && i < ticks.length; i++) if (pxOf(ticks[i]) - pxOf(ticks[i - 1]) < minGap) ok = false;
    if (ok) return ticks;
  }
  return [x0, x1];
}

let lastPlot = null;
function drawPlot(points, band, marker, logX, yLabel) {
  lastPlot = [points, band, marker, logX, yLabel];
  const svg = $("plot");
  const rect = svg.getBoundingClientRect();
  const W = Math.max(240, Math.round(rect.width) || 560), H = Math.max(200, Math.round(rect.height) || 340);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.textContent = "";
  if (points.length < 2) {
    svg.appendChild(svgEl("text", { x: W / 2, y: H / 2, "text-anchor": "middle", class: "tick-label" }, "Not enough data to plot."));
    return;
  }
  const xs = points.map(p => p[0]);
  let ys = points.map(p => p[1]);
  if (band) ys = ys.concat(band.flat());
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const yLo = Math.min(0, ...ys), yHiRaw = Math.max(...ys);
  const yAxis = niceLinearTicks(yLo, yHiRaw > yLo ? yHiRaw * 1.04 : yLo + 1, 5);
  const y0 = Math.min(yLo, yAxis.ticks[0]);
  let y1 = yAxis.ticks[yAxis.ticks.length - 1];
  if (y1 < yHiRaw * 1.01) y1 += yAxis.step;
  yAxis.ticks.push(...(y1 > yAxis.ticks[yAxis.ticks.length - 1] ? [y1] : []));
  const yDigits = Math.max(0, -Math.floor(Math.log10(yAxis.step) + 1e-9));
  const yText = v => { const t = yDigits ? (v + 0).toFixed(yDigits) : fmtInt(v); return /^-0(\.0+)?$/.test(t) ? t.slice(1) : t; };

  const widest = Math.max(...yAxis.ticks.map(v => yText(v).length));
  const PAD = { l: Math.round(22 + widest * 6.6 + 12), r: 22, t: 14, b: 46 };
  const w = W - PAD.l - PAD.r, h = H - PAD.t - PAD.b;
  const useLog = logX && x0 > 0;
  const px = x => PAD.l + (useLog ? w * (Math.log(x) - Math.log(x0)) / (Math.log(x1) - Math.log(x0)) : w * (x - x0) / (x1 - x0));
  const py = y => PAD.t + h - (h * (y - y0) / (y1 - y0));
  const c = v => Math.round(v) + 0.5;                       // half-pixel alignment keeps 1px lines crisp

  // grid + tick labels (y)
  for (const v of yAxis.ticks) {
    const gy = c(py(v));
    svg.appendChild(svgEl("line", { x1: PAD.l, y1: gy, x2: PAD.l + w, y2: gy, class: "grid-line" }));
    svg.appendChild(svgEl("text", { x: PAD.l - 8, y: gy + 4, "text-anchor": "end", class: "tick-label" }, yText(v)));
  }
  // grid + tick labels (x)
  const xTicks = useLog ? niceLogTicks(x0, x1, w, 46, px)
    : niceLinearTicks(x0, x1, Math.max(2, Math.floor(w / 80))).ticks;
  for (const v of xTicks) {
    const gx = c(px(v));
    svg.appendChild(svgEl("line", { x1: gx, y1: PAD.t, x2: gx, y2: PAD.t + h, class: "grid-line" }));
    svg.appendChild(svgEl("text", { x: gx, y: PAD.t + h + 16, "text-anchor": "middle", class: "tick-label" }, fmtInt(v)));
  }
  // frame + axis titles
  svg.appendChild(svgEl("rect", { x: c(PAD.l), y: c(PAD.t), width: Math.round(w), height: Math.round(h), fill: "none", class: "axis-line" }));
  const yt = svgEl("text", { transform: `translate(14 ${PAD.t + h / 2}) rotate(-90)`, "text-anchor": "middle", class: "axis-title" });
  yt.appendChild(document.createTextNode(yLabel[0]));
  const sub = svgEl("tspan", { dy: 3, "font-size": 9 }, yLabel[1]); yt.appendChild(sub);
  const rest = svgEl("tspan", { dy: -3 }, yLabel[2]); yt.appendChild(rest);
  svg.appendChild(yt);
  svg.appendChild(svgEl("text", { x: PAD.l + w / 2, y: H - 8, "text-anchor": "middle", class: "axis-title" }, "spin speed \u03c9 [rpm]"));

  // everything data-related is clipped to the plot area
  const clipId = "plot-clip";
  const defs = svgEl("defs", {});
  const clip = svgEl("clipPath", { id: clipId });
  clip.appendChild(svgEl("rect", { x: PAD.l, y: PAD.t, width: w, height: h }));
  defs.appendChild(clip); svg.appendChild(defs);
  const g = svgEl("g", { "clip-path": `url(#${clipId})` });
  svg.appendChild(g);

  if (band) {
    const top = xs.map((x, i) => `${px(x).toFixed(2)},${py(band[i][1]).toFixed(2)}`);
    const bot = xs.slice().reverse().map((x, i) => `${px(x).toFixed(2)},${py(band[xs.length - 1 - i][0]).toFixed(2)}`);
    g.appendChild(svgEl("polygon", { points: top.concat(bot).join(" "), class: "band" }));
  }
  g.appendChild(svgEl("path", { d: points.map((p, i) => `${i === 0 ? "M" : "L"}${px(p[0]).toFixed(2)},${py(p[1]).toFixed(2)}`).join(" "), class: "curve" }));

  if (marker && marker[0] >= x0 && marker[0] <= x1) {
    const mx = px(marker[0]), my = py(marker[1]);
    svg.appendChild(svgEl("line", { x1: c(mx), y1: PAD.t, x2: c(mx), y2: PAD.t + h, class: "marker-line" }));
    svg.appendChild(svgEl("circle", { cx: mx, cy: my, r: 5, class: "marker" }));
    const label = marker[1].toLocaleString("en-US", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + " nm";
    const tw = Math.round(label.length * 7 + 14), th = 22;
    let tx = mx + 10, ty = my - th - 8;
    if (tx + tw > PAD.l + w) tx = mx - 10 - tw;             // flip to the left near the right edge
    if (ty < PAD.t) ty = my + 10;                            // and below the point near the top
    svg.appendChild(svgEl("rect", { x: tx, y: ty, width: tw, height: th, rx: 3, class: "tag-bg" }));
    svg.appendChild(svgEl("text", { x: tx + tw / 2, y: ty + 15, "text-anchor": "middle", class: "tag-text" }, label));
  }
}
// redraw when the container is resized (window, phone rotation, layout change)
(function () {
  let lastW = 0, lastH = 0;
  const redraw = () => {
    const r = $("plot").getBoundingClientRect();
    if (Math.round(r.width) === lastW && Math.round(r.height) === lastH) return;
    lastW = Math.round(r.width); lastH = Math.round(r.height);
    if (lastPlot) drawPlot(...lastPlot);
  };
  if (typeof ResizeObserver !== "undefined") new ResizeObserver(redraw).observe($("plot"));
  else window.addEventListener("resize", redraw);
})();

// ============================================================================
recompute();
</script>
</body>
